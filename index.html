let goTok=0;
/* tab-switch click: short sample, Web Audio (low latency, mixes with other audio, never blocks the UI) */
const TabSnd=(()=>{let ctx=null,buf=null,loading=false;
 const init=()=>{if(ctx||!(window.AudioContext||window.webkitAudioContext))return;try{ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch(e){ctx=null}};
 const load=()=>{if(buf||loading||!ctx)return;loading=true;fetch('tab.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>ctx.decodeAudioData(b,ok,no))).then(b=>{buf=b}).catch(()=>{}).finally(()=>{loading=false})};
 const play=()=>{try{if(S.set.snd===false)return;init();if(!ctx)return;if(ctx.state==='suspended')ctx.resume().catch(()=>{});load();if(!buf)return;const src=ctx.createBufferSource(),g=ctx.createGain(),t0=ctx.currentTime,d=buf.duration,fi=Math.min(.02,d*.3),fo=Math.min(.035,d*.45),V=.275; /* level of the approved v70 build, with a fade in and a fade out */ g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(V,t0+fi);g.gain.setValueAtTime(V,Math.max(t0+fi,t0+d-fo));g.gain.linearRampToValueAtTime(0,t0+d);src.buffer=buf;src.connect(g);g.connect(ctx.destination);src.start(t0)}catch(e){}};
 // unlock on the first touch so the very first tab switch already has a decoded buffer
 ['touchstart','pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{init();load();if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{})},{once:true,passive:true,capture:true}));
 return{play}})();

 if(t===S.tab||!el.animate||matchMedia('(prefers-reduced-motion:reduce)').matches){S.tab=t;render();scrollTo(0,0);return}

function indTo(t,k,d,snap){IND.t=t;IND.k=k||170;IND.d=d||19;if(snap){IND.c=t;IND.v=0;navEl.style.setProperty('--i',t);return}if(!IND.raf){IND.last=performance.now();IND.raf=requestAnimationFrame(indStep)}}
function indStep(now){const dt=Math.min(.032,(now-IND.last)/1000);IND.last=now;IND.v+=(-IND.k*(IND.c-IND.t)-IND.d*IND.v)*dt;IND.c+=IND.v*dt;
 navEl.style.setProperty('--i',Math.min(NN-.94,Math.max(-.06,IND.c)).toFixed(4));// limit: never leaves the bar
 if(Math.abs(IND.v)<.003&&Math.abs(IND.c-IND.t)<.002){IND.c=IND.t;IND.v=0;navEl.style.setProperty('--i',IND.t);IND.raf=0;return}IND.raf=requestAnimationFrame(indStep)}
function navSync(){const c=tIdx(S.tab);navEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===c));
 if(!navEl.classList.contains('hold')){if(!IND.init){IND.init=1;indTo(c,0,0,true)}else indTo(c)}
 if(navEl.dataset.last!==String(c))anim(c)}
(()=>{let nd=null;
 const frac=x=>{const r=navEl.getBoundingClientRect(),bw=(r.width-24)/NN;return Math.min(NN-1,Math.max(0,(x-r.left-6-bw/2)/(bw+4)))};
 const hl=n=>navEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===n));
 navEl.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button)return;const f=frac(e.clientX);nd={n:Math.round(f)};try{navEl.setPointerCapture(e.pointerId)}catch(_){}navEl.classList.add('hold');hl(nd.n);anim(nd.n);indTo(f,320,30)});
 navEl.addEventListener('pointermove',e=>{if(!nd)return;const f=frac(e.clientX);indTo(f,320,30);const n=Math.round(f);if(n!==nd.n){nd.n=n;hl(n);anim(n);if(navigator.vibrate)navigator.vibrate(8)}});
 const stop=()=>{nd=null;navEl.classList.remove('hold')};
 const up=e=>{if(!nd)return;const n=Math.round(frac(e.clientX));stop();indTo(n,170,17);if(TABS[n]!==S.tab)go(TABS[n]);else navSync()};
 navEl.addEventListener('pointerup',up);navEl.addEventListener('pointercancel',()=>{stop();navSync()});
 // horizontal swipe on page content switches tabs
 const app=document.getElementById('app');let sw=null;
 app.addEventListener('touchstart',e=>{sw=(e.touches.length===1&&!document.getElementById('md')&&!e.target.closest('input,select,textarea'))?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}:null},{passive:true});
 app.addEventListener('touchcancel',()=>{sw=null},{passive:true});
 app.addEventListener('touchend',e=>{if(!sw)return;const s0=sw;sw=null;const c=e.changedTouches[0],dx=c.clientX-s0.x,dy=c.clientY-s0.y;
  if((()=>{const ax=Math.abs(dx),ay=Math.abs(dy),dt=Math.max(1,Date.now()-s0.t);return dt<1000&&((ax>38&&ax>ay*1.05)||(ax>20&&ax/dt>.3&&ax>ay*1.2))})()&&Date.now()-(window.dragTs||0)>500&&!document.querySelector('.card.drag')){const dir=dx<0?1:-1,n=tIdx(S.tab)+dir;if(n>=0&&n<NN)go(TABS[n],dir)}},{passive:true});
})();

async function purgeBanned(){ // admin only: first a dry run, then a confirmed delete
 try{const post=b=>API('/api/social',{method:'POST',body:JSON.stringify({op:'purgeBanned',...b})}).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error||r.status);return j}));
  const d=await post({});if(!d.count){toast('No banned accounts to delete');return}
  const txt=d.accounts.map(a=>'@'+(a.nick||'?')+': '+a.posts+' posts, '+a.stories+' stories, '+a.chats+' chats').join('\n');
  if(!confirm('Permanently delete these banned accounts and their data (profile, posts, stories, chats)? They stay locked out.\n\n'+txt))return;
  const r=await post({confirm:true});toast('Deleted: '+r.count)}catch(e){toast('Failed: '+e.message)}}
function copyAcc(){const v=String(UID||'');const ok=()=>toast('Account ID copied');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,ok);else ok()}
function showBan(){if(document.getElementById('banned'))return;const d=document.createElement('div');d.id='banned';d.setAttribute('data-nt','');d.style.cssText='position:fixed;inset:0;z-index:99999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:800 34px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.02em;text-align:center;padding:24px';d.textContent='хардес';document.body.appendChild(d);document.body.style.overflow='hidden'}
const API=(path,opt={})=>fetch(path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json','X-Requested-With':'wd','X-Tz':String(new Date().getTimezoneOffset()),'X-Vis':document.visibilityState==='visible'?'1':'0',...(opt.headers||{})}}).then(r=>{if(r.status===403){r.clone().json().then(j=>{if(j&&j.error==='banned')showBan()}).catch(()=>{})}return r});
const Q={get(){return Store.get('q',{p:{},d:{},m:0})},set(q){Store.set('q',q)}};
let syncT=null,syncing=false,cfgP=null,gInit=false;
const syncLabel=()=>({ok:'Synced',busy:'Syncing…',off:'Offline — will sync when online',err:'Sync error — will retry',none:'Cloud storage not configured'}[S.sync]||'');
function setSync(v){S.sync=v;const e=document.getElementById('syncst');if(e)e.textContent=syncLabel()}
const schedSync=(ms)=>{clearTimeout(syncT);syncT=setTimeout(syncNow,ms||900)};
function qPut(id){if(!S.user)return;const q=Q.get();q.p[id]=1;delete q.d[id];Q.set(q);schedSync()}
function qDel(id){if(!S.user)return;const q=Q.get();q.d[id]=1;delete q.p[id];Q.set(q);schedSync()}
function qMeta(){if(!S.user)return;Store.set('metaTs',Date.now());const q=Q.get();q.m=1;Q.set(q);schedSync()}
const strip=it=>({id:it.id,name:it.name,cat:it.cat,color:it.color,season:it.season,warm:it.warm,rain:it.rain,wind:it.wind==null?null:it.wind,tmin:it.tmin==null?null:it.tmin,tmax:it.tmax==null?null:it.tmax,hexManual:it.hexManual||null,ai:it.ai||null,gen:!!it.gen,img:it.img,ts:it.ts||idNum(it)});
const httpErr=r=>Object.assign(new Error('http'),{code:r.status});
async function call(body){const r=await API('/api/data',{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw httpErr(r);return r.json()}
async function flush(){
 const put=Object.keys(Q.get().p);
 for(let i=0;i<put.length;i+=4){const ids=put.slice(i,i+4),items=ids.map(id=>S.items.find(x=>x.id===id)).filter(Boolean).map(strip);
  if(items.length)await call({op:'putItems',items});
  const f=Q.get();ids.forEach(id=>delete f.p[id]);Q.set(f)}
 const del=Object.keys(Q.get().d);
 for(let i=0;i<del.length;i+=100){const ids=del.slice(i,i+100);await call({op:'delItems',ids});const f=Q.get();ids.forEach(id=>delete f.d[id]);Q.set(f)}
 if(Q.get().m){const ts=Store.get('metaTs',Date.now());await call({op:'meta',ts,meta:{outfits:S.outfits,hist:S.hist||[],settings:S.set,pos:S.pos}});const f=Q.get();if(Store.get('metaTs',0)===ts)f.m=0;Q.set(f)}
}
function clearGuest(){['items','outfits','set','pos','lastw','q','metaTs','hist','today'].forEach(k=>{try{localStorage.removeItem('wd:'+k)}catch(e){}});try{indexedDB.deleteDatabase('wardrobe')}catch(e){}}
async function adopt(){ // first sign-in of a brand-new account: move the guest wardrobe into it
 const a=S.adopt;S.adopt=null;const f=Q.get();f.m=1;
 if(a&&(a.items.length||a.outfits.length)){
  for(const it of a.items){it.ts=it.ts||idNum(it);await dbPut(it);if(!S.items.some(x=>x.id===it.id))S.items.push(it);f.p[it.id]=1}
  S.outfits=[...a.outfits];S.hist=[...(a.hist||[])];S.set={...DEFSET,...a.set};Store.set('outfits',S.outfits);Store.set('hist',S.hist);Store.set('set',S.set);for(const[k,u]of Object.entries(a.imgs||{})){S.oimg[k]=u;await imgPut(k,u).catch(()=>{})}
  S.items.sort((x,y)=>idNum(y)-idNum(x));S.gen=null;
 }
 if(a&&!(a.items.length||a.outfits.length)){S.set={...DEFSET,...a.set};Store.set('set',S.set)} // settings (city, theme, preferences) follow the guest into the new account even with an empty wardrobe
 Store.set('metaTs',Date.now());Q.set(f);
 if(a&&(a.items.length||a.outfits.length))clearGuest(); // data is now durable in the account's local store + upload queue
 await flush();applyTheme();render();if(a&&a.set&&a.set.city)loadWeather();
}
async function pull(){
 const r=await API('/api/data');if(!r.ok)throw httpErr(r);
 const {index,meta}=await r.json();
 if(S.adopt&&!Object.keys(index).length&&!meta){await adopt();return}
 S.adopt=null;
 const q=Q.get(),local=new Map(S.items.map(i=>[i.id,i.ts||idNum(i)]));let changed=false;
 const need=Object.keys(index).filter(id=>!q.d[id]&&(!local.has(id)||index[id]>local.get(id)));
 for(let i=0;i<need.length;i+=8){const r2=await API('/api/items?ids='+need.slice(i,i+8).join(','));if(!r2.ok)throw httpErr(r2);
  for(const it of (await r2.json()).items){await dbPut(it);const k=S.items.findIndex(x=>x.id===it.id);k>=0?S.items[k]=it:S.items.push(it);changed=true}}
 for(const it of [...S.items]){ // server is the source of truth for existence (deletions made on other devices)
  if(index[it.id]===undefined&&!q.p[it.id]){await dbDel(it.id);S.items=S.items.filter(x=>x.id!==it.id);changed=true}
  else if(index[it.id]!==undefined&&(it.ts||idNum(it))>index[it.id]){const f=Q.get();f.p[it.id]=1;Q.set(f)}}
 const lts=Store.get('metaTs',0);
 if(meta&&meta.ts>lts){const c0=JSON.stringify(S.set.city);S.outfits=meta.outfits||[];S.hist=meta.hist||[];S.set={...DEFSET,...meta.settings};S.pos=meta.pos||{};Store.set('hist',S.hist);
  Store.set('outfits',S.outfits);Store.set('set',S.set);Store.set('pos',S.pos);Store.set('metaTs',meta.ts);applyTheme();if(JSON.stringify(S.set.city)!==c0)loadWeather();changed=true}
 else if(!meta||lts>meta.ts){const f=Q.get();f.m=1;Q.set(f);if(!lts)Store.set('metaTs',Date.now())}
 await flush();
 if(changed){S.items.sort((x,y)=>idNum(y)-idNum(x));S.gen=null;render();analyzeMissing()}
}
async function syncNow(){
 if(!S.user||syncing)return;
 if(!navigator.onLine){setSync('off');return}
 syncing=true;setSync('busy');
 try{await flush();await pull();setSync('ok')}
 catch(e){if(e.code===401)sessionLost();else if(e.code===503)setSync('none');else setSync(navigator.onLine?'err':'off')}
 finally{syncing=false}
}
function loadLocal(){S.outfits=Store.get('outfits',[]);S.hist=Store.get('hist',[]);S.set={...DEFSET,...Store.get('set',{})};S.pos=Store.get('pos',{})}
async function switchAccount(user){
 UID=user?String(user.sub):null;S.user=user;
 try{user?localStorage.setItem('wdg:session',JSON.stringify(user)):localStorage.removeItem('wdg:session')}catch(e){}
 if(DB.db){try{DB.db.close()}catch(e){}DB.db=null}
 if(window.SOC)SOC.reset();if(window.CHAT)CHAT.reset();loadLocal();S.items=[];S.gen=null;S.sync=null;S.fx=false;S.lk={};S.aiL={};S.oimg={};S.aiMsg='';
 applyTheme();render();await initItems();S.gen=null;render();loadWeather();analyzeMissing();
}
async function sessionLost(){toast('Session expired — please sign in again');await switchAccount(null)}
async function onCred(resp){
 try{const r=await API('/api/auth',{method:'POST',body:JSON.stringify({credential:resp.credential})});if(!r.ok)throw 0;const {user}=await r.json();
  if(!S.user)S.adopt={items:S.items.slice(),outfits:S.outfits.slice(),hist:(S.hist||[]).slice(),imgs:{...S.oimg},set:{...S.set}};
  await switchAccount(user);toast('Signed in as '+user.name);syncNow();
 }catch(e){alert('Не удалось войти через Google. Попробуйте ещё раз.')}
}
async function logout(){
 if(!confirm('Log out? Your data stays safe in your account.'))return;
 const uid=UID;try{syncing=false;if(navigator.onLine)await flush()}catch(e){}
 const q=Q.get();if(Object.keys(q.p).length+Object.keys(q.d).length+q.m&&!confirm('Some changes are not synced yet and will be lost on this device. Log out anyway?'))return;
 try{window.CHAT&&CHAT.wipe&&await CHAT.wipe()}catch(e){}
 try{const r=await API('/api/auth',{method:'DELETE'});if(!r.ok)throw 0}catch(e){try{localStorage.setItem('wdg:logout','1')}catch(_){}}
 if(DB.db){try{DB.db.close()}catch(e){}DB.db=null}
 try{indexedDB.deleteDatabase('wardrobe_u'+uid)}catch(e){}
 Object.keys(localStorage).filter(k=>k.startsWith('wd:u'+uid+':')).forEach(k=>localStorage.removeItem(k)); // nothing of this account stays on a shared device
 await switchAccount(null);toast('Logged out');
}

async function verifySession(){
 try{const r=await API('/api/auth');
  if(r.status===401){await sessionLost();return}
  if(!r.ok){setSync('err');return}
  const {user}=await r.json();if(String(user.sub)!==UID){await switchAccount(user)}else{S.user=user;try{localStorage.setItem('wdg:session',JSON.stringify(user))}catch(e){}}
  syncNow();
 }catch(e){setSync('off')}
}
